<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080d1b">
<title>HTML App Studio</title>

<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{
 margin:0;color:#f5f6ff;min-height:100vh;
 font-family:Tahoma,Arial;
 background:radial-gradient(ellipse at 90% 0%,#5145a744,transparent 45%),radial-gradient(ellipse at 0% 80%,#087d7840,transparent 45%),#080d1b;
}
header{padding:20px 16px 12px;display:flex;align-items:center;gap:12px}
.logo{
 width:45px;height:45px;border-radius:15px;
 background:linear-gradient(135deg,#9184ff,#37d9c3);
 display:grid;place-items:center;font-size:23px;
}
h1{font-size:19px;margin:0}
header small{color:#aab5cc;display:block;margin-top:5px}
main{padding:8px 13px 28px;max-width:850px;margin:auto}
.glass{
 background:#ffffff0d;border:1px solid #ffffff1c;
 border-radius:18px;padding:14px;
 box-shadow:0 8px 24px #0002;margin-bottom:12px;
}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.title{font-size:14px;font-weight:bold}
.muted{font-size:11px;color:#aab5cc}
input,textarea{
 width:100%;border:1px solid #ffffff20;background:#070c19;
 color:white;border-radius:12px;padding:12px;
 outline:none;font:13px Tahoma;margin-top:8px;
}
textarea{
 height:250px;direction:ltr;text-align:left;
 font-family:monospace;line-height:1.55;resize:vertical;
}
button{
 border:1px solid #ffffff24;background:#ffffff12;color:white;
 padding:11px 13px;border-radius:12px;font:12px Tahoma;
 cursor:pointer;touch-action:manipulation;
 -webkit-tap-highlight-color:transparent;
 transition:opacity .15s;
}
button:active{opacity:.65}
.primary{background:linear-gradient(120deg,#7869ee,#388fdb);border:0}
.red{color:#ff9cac}
.buttons{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
#list{display:flex;gap:7px;overflow-x:auto;padding:10px 0 2px}
.app{white-space:nowrap}
.app.active{background:#7c6cff55;border-color:#9d92ff}
.empty{color:#aab5cc;font-size:12px;padding:8px 0}
.note{font-size:10px;color:#9eabc4;line-height:1.9}
#preview{
 width:100%;height:310px;border:0;border-radius:12px;
 background:white;margin-top:10px;display:block;
}
#previewBox.fullscreen{
 position:fixed;inset:0;z-index:9999;
 background:#080d1b;padding:12px;
 padding-top:calc(12px + env(safe-area-inset-top));
 padding-bottom:calc(12px + env(safe-area-inset-bottom));
 display:flex;flex-direction:column;gap:10px;
 border:0;border-radius:0;margin:0;
}
#previewBox.fullscreen #preview{
 flex:1;min-height:0;height:auto;margin:0;
}
#previewBox.fullscreen .row{flex-shrink:0}
#previewBox.fullscreen .muted{display:none}
body.preview-open{overflow:hidden}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>

<body>
<header>
 <div class="logo">✦</div>
 <div>
  <h1>استودیو HTML</h1>
  <small>ساخت و اجرای اپلیکیشن‌های HTML</small>
 </div>
</header>

<main>

<section class="glass">
 <div class="row">
  <span class="title">اپلیکیشن‌های ذخیره‌شده</span>
  <button class="primary" onclick="fresh()">＋ پروژه جدید</button>
 </div>
 <div id="list"></div>
</section>

<section class="glass">
 <div class="title">ویرایش پروژه</div>
 <input id="name" maxlength="60" placeholder="نام اپلیکیشن">
 <textarea id="code" spellcheck="false" autocapitalize="off" placeholder="کد HTML را وارد کن..."></textarea>

 <div class="buttons">
  <button class="primary" onclick="saveApp()">ذخیره</button>
  <button onclick="run()">▶ اجرا</button>
  <button onclick="exportHtml()">خروجی HTML</button>
  <button class="red" onclick="deleteApp()">حذف</button>
 </div>
</section>

<section class="glass" id="previewBox">
 <div class="row">
  <span class="title">نمایشگر HTML</span>
  <div class="buttons" style="margin:0">
   <button onclick="run()">↻ تازه‌سازی</button>
   <button class="primary" id="fullscreenBtn" onclick="togglePreviewFullscreen()">⛶ تمام‌صفحه</button>
  </div>
 </div>

 <div class="muted">پیش‌نمایش داخل برنامه</div>

 <iframe id="preview"
  title="HTML Preview"
  sandbox="allow-scripts allow-forms allow-modals">
 </iframe>
</section>

<p class="note">
 پروژه‌ها در حافظه داخلی برنامه ذخیره می‌شوند.
 برای جلوگیری از دست رفتن اطلاعات از خروجی HTML استفاده کن.
</p>

</main>

<script>
'use strict';

const $=id=>document.getElementById(id);

const starter=`<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اپ من</title>
</head>
<body style="font-family:Tahoma;padding:25px">
<h2>سلام! 👋</h2>
<p>اولین اپلیکیشن HTML من</p>
<button onclick="alert('سلام!')">امتحان کن</button>
</body>
</html>`;

let apps=[];
let current=null;

function notify(text){
 if(window.AndroidStore) AndroidStore.message(text);
 else alert(text);
}

function load(){
 try{
  apps=JSON.parse(AndroidStore.load()||'[]');
  if(!Array.isArray(apps))apps=[];
 }catch(e){apps=[]}

 draw();

 if(apps.length)select(apps[0].id);
 else fresh();
}

function persist(){
 try{
  AndroidStore.save(JSON.stringify(apps));
  return true;
 }catch(e){
  notify('خطا در ذخیره پروژه');
  return false;
 }
}

function draw(){
 const list=$('list');
 list.innerHTML='';

 if(!apps.length){
  list.innerHTML='<div class="empty">هنوز پروژه‌ای ذخیره نشده است.</div>';
  return;
 }

 apps.forEach(a=>{
  const b=document.createElement('button');
  b.className='app'+(a.id===current?' active':'');
  b.textContent='🌐 '+a.name;
  b.onclick=()=>select(a.id);
  list.appendChild(b);
 });
}

function fresh(){
 current=null;
 $('name').value='اپلیکیشن جدید';
 $('code').value=starter;
 draw();
 run();
}

function select(id){
 const a=apps.find(x=>x.id===id);
 if(!a)return;

 current=id;
 $('name').value=a.name;
 $('code').value=a.html;
 draw();
 run();
}

function saveApp(){
 const name=$('name').value.trim()||'اپ بدون نام';
 const html=$('code').value;

 if(!html.trim()){
  notify('کد HTML را وارد کن');
  return;
 }

 if(current){
  const a=apps.find(x=>x.id===current);
  if(!a)return;
  a.name=name;
  a.html=html;
  a.updated=Date.now();
 }else{
  current='p'+Date.now();
  apps.unshift({
   id:current,
   name:name,
   html:html,
   updated:Date.now()
  });
 }

 if(persist()){
  draw();
  notify('پروژه ذخیره شد ✓');
 }
}

function run(){
 $('preview').srcdoc=$('code').value;
}

function togglePreviewFullscreen(){
 const box=$('previewBox');
 const active=box.classList.toggle('fullscreen');

 document.body.classList.toggle('preview-open',active);

 $('fullscreenBtn').textContent=
  active?'✕ بستن تمام‌صفحه':'⛶ تمام‌صفحه';
}

function closePreviewFullscreen(){
 if($('previewBox').classList.contains('fullscreen')){
  togglePreviewFullscreen();
  return true;
 }
 return false;
}

function deleteApp(){
 if(!current){
  notify('ابتدا یک پروژه انتخاب کن');
  return;
 }

 if(!confirm('این پروژه حذف شود؟'))return;

 apps=apps.filter(x=>x.id!==current);
 current=null;
 persist();
 fresh();
 notify('پروژه حذف شد');
}

function exportHtml(){
 const html=$('code').value;
 const name=$('name').value.trim()||'app';

 if(!html.trim()){
  notify('کدی برای خروجی وجود ندارد');
  return;
 }

 if(window.AndroidStore){
  AndroidStore.exportHtml(name,html);
 }else{
  const blob=new Blob([html],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=name+'.html';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
 }
}

document.addEventListener('keydown',e=>{
 if(e.key==='Escape')closePreviewFullscreen();
});

load();
</script>
</body>
</html>
