
name: Build HTML App Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK Packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Environment
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Verify Project Files
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/example/htmlappstudio/MainActivity.kt
          test -f app/src/main/assets/index.html

      - name: Build APK
        run: |
          gradle --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug

      - name: Verify APK
        if: success()
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HTML-App-Studio-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HTML-App-Studio-Build-Reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: warn
          retention-days: 7
          
